services:
  postgres:
    image: postgres:16-alpine
    container_name: linkforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkforge
      POSTGRES_PASSWORD: linkforge
      POSTGRES_DB: linkforge
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linkforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
